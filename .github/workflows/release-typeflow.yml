name: TypeFlow release

on:
  push:
    tags: ["typeflow-v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typing_trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TypeFlow-linux main.py
      - uses: actions/upload-artifact@v4
        with:
          name: TypeFlow-linux
          path: typing_trainer/dist/TypeFlow-linux

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: typing_trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TypeFlow main.py
      - uses: actions/upload-artifact@v4
        with:
          name: TypeFlow-windows
          path: typing_trainer/dist/TypeFlow.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/TypeFlow-linux/TypeFlow-linux
            release/TypeFlow-windows/TypeFlow.exe
